<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520"><rect width="800" height="520" rx="28" fill="#fbf5ec"/><style>text{font-family:'PingFang TC','Microsoft JhengHei',sans-serif;font-weight:600}</style><circle cx="760" cy="52" r="65" fill="#f7e3d0" opacity=".55"/><circle cx="47" cy="461" r="79" fill="#e6f1e6" opacity=".75"/><text x="40" y="61" font-size="31" fill="#2e231c" text-anchor="start">填表交給 AI，最後確認留給人</text><rect x="56" y="129" width="244" height="264" rx="18" fill="#fffdf8" stroke="#ead8c4" stroke-width="3"/><path d="M86 169L270 169" fill="none" stroke="#b4501f" stroke-width="4" stroke-linecap="round"/><path d="M86 209L270 209" fill="none" stroke="#ead8c4" stroke-width="7" stroke-linecap="round"/><path d="M86 245L258 245" fill="none" stroke="#ead8c4" stroke-width="7" stroke-linecap="round"/><path d="M86 281L246 281" fill="none" stroke="#ead8c4" stroke-width="7" stroke-linecap="round"/><text x="82" y="187" font-size="28" fill="#2e231c" text-anchor="start">發票資料</text><text x="86" y="234" font-size="21" fill="#65564b" text-anchor="start">買受人</text><text x="86" y="276" font-size="21" fill="#65564b" text-anchor="start">品項</text><text x="86" y="316" font-size="21" fill="#65564b" text-anchor="start">金額</text><path d="M329 267L391 267" fill="none" stroke="#b4501f" stroke-width="5" stroke-linecap="round"/><path d="M377 256l14 11-14 11" fill="none" stroke="#b4501f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="423" y="164" width="319" height="204" rx="18" fill="#e6f1e6" stroke="#ead8c4" stroke-width="3"/><text x="582" y="224" font-size="30" fill="#2f6646" text-anchor="middle">先確認內容</text><path d="M489 284l12 12 25-29" fill="none" stroke="#2f6646" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="548" y="301" font-size="25" fill="#2f6646" text-anchor="start">確認後開立</text><text x="400" y="478" font-size="22" fill="#65564b" text-anchor="middle">登入與開立前，兩次交回本人確認</text></svg>