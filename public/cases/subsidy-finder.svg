<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520"><rect width="800" height="520" rx="28" fill="#fbf5ec"/><style>text{font-family:'PingFang TC','Microsoft JhengHei',sans-serif;font-weight:600}</style><circle cx="760" cy="52" r="65" fill="#f7e3d0" opacity=".55"/><circle cx="47" cy="461" r="79" fill="#e6f1e6" opacity=".75"/><text x="40" y="61" font-size="31" fill="#2e231c" text-anchor="start">填一次條件，先篩出可能適合的</text><rect x="35" y="161" width="224" height="212" rx="18" fill="#fffdf8" stroke="#ead8c4" stroke-width="3"/><path d="M35 199L259 199" fill="none" stroke="#ead8c4" stroke-width="3" stroke-linecap="round"/><circle cx="57" cy="180" r="4" fill="#b4501f"/><circle cx="74" cy="180" r="4" fill="#ead8c4"/><circle cx="91" cy="180" r="4" fill="#ead8c4"/><text x="59" y="229" font-size="25" fill="#2e231c" text-anchor="start">我的條件</text><rect x="57" y="251" width="174" height="22" rx="6" fill="#fffdf8" stroke="#ead8c4" stroke-width="3"/><rect x="57" y="283" width="174" height="22" rx="6" fill="#fffdf8" stroke="#ead8c4" stroke-width="3"/><rect x="57" y="315" width="174" height="22" rx="6" fill="#fffdf8" stroke="#ead8c4" stroke-width="3"/><path d="M282 271L319 271" fill="none" stroke="#b4501f" stroke-width="5" stroke-linecap="round"/><path d="M305 260l14 11-14 11" fill="none" stroke="#b4501f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="343" y="175" width="133" height="198" rx="18" fill="#e6f1e6" stroke="#ead8c4" stroke-width="3"/><text x="409" y="221" font-size="23" fill="#2f6646" text-anchor="middle">可申請</text><rect x="366" y="245" width="87" height="23" rx="6" fill="#fffdf8" stroke="#ead8c4" stroke-width="3"/><rect x="366" y="279" width="87" height="23" rx="6" fill="#fffdf8" stroke="#ead8c4" stroke-width="3"/><rect x="366" y="313" width="87" height="23" rx="6" fill="#fffdf8" stroke="#ead8c4" stroke-width="3"/><rect x="489" y="175" width="133" height="198" rx="18" fill="#f7e3d0" stroke="#ead8c4" stroke-width="3"/><text x="555" y="221" font-size="23" fill="#65564b" text-anchor="middle">待確認</text><rect x="512" y="245" width="87" height="23" rx="6" fill="#fffdf8" stroke="#ead8c4" stroke-width="3"/><rect x="512" y="279" width="87" height="23" rx="6" fill="#fffdf8" stroke="#ead8c4" stroke-width="3"/><rect x="512" y="313" width="87" height="23" rx="6" fill="#fffdf8" stroke="#ead8c4" stroke-width="3"/><rect x="635" y="175" width="133" height="198" rx="18" fill="#f0e7e1" stroke="#ead8c4" stroke-width="3"/><text x="701" y="221" font-size="23" fill="#65564b" text-anchor="middle">不符合</text><rect x="658" y="245" width="87" height="23" rx="6" fill="#fffdf8" stroke="#ead8c4" stroke-width="3"/><rect x="658" y="279" width="87" height="23" rx="6" fill="#fffdf8" stroke="#ead8c4" stroke-width="3"/><rect x="658" y="313" width="87" height="23" rx="6" fill="#fffdf8" stroke="#ead8c4" stroke-width="3"/><text x="400" y="478" font-size="22" fill="#65564b" text-anchor="middle">每一種結果，都附上判定理由</text></svg>